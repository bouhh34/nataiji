name: Publish downloadable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-download.yml'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"
      - run: npm ci --no-audit --no-fund
      - run: npx cap add android
      - run: npm run mobile:assets:android
      - run: npx cap sync android
      - name: Apply RC version metadata
        run: |
          VERSION_NAME="$(node -e "const p=require('./package.json'); process.stdout.write(p.version)")"
          sed -i -E "s/versionCode [0-9]+/versionCode 1/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare public filename
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk Nataiji-Android.apk
      - name: Publish stable download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-latest
          name: Nataiji Android Download
          prerelease: true
          body: |
            نتائجي v1.0.0 RC1 — نسخة أندرويد مرشحة للإطلاق للتثبيت المباشر.
            المصدر الرسمي للتنزيل هو صفحة نتائجي فقط.
          files: Nataiji-Android.apk
