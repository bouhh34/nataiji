name: Director workspace regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/director-workspace.js'
      - 'src/server.js'
      - 'public/director-*'
      - 'public/auth-access-v2.js'
      - 'public/professor-v2.js'
      - 'public/offline-session-v1.js'
      - 'public/index.html'
      - 'public/sw.js'
      - 'scripts/director-workspace-regression.mjs'
      - 'scripts/director-offline-regression.mjs'
      - 'scripts/director-browser-acceptance.mjs'
      - 'scripts/release-audit.mjs'
      - 'package.json'
      - '.github/workflows/director-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nataiji_director_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - name: Install Playwright for director acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start disposable Nataiji server
        env:
          NODE_ENV: development
          PORT: '3225'
          DATABASE_URL: postgresql://postgres:local_test_password@127.0.0.1:5432/nataiji_director_qa
          REDIS_URL: ''
        run: |
          npm start > /tmp/nataiji-director-qa.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3225/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nataiji-director-qa.log
          exit 1
      - name: Verify director mobile account, records, and offline replay
        env:
          NATAIJI_TEST_URL: http://127.0.0.1:3225
        run: node scripts/director-browser-acceptance.mjs
      - name: Show director server logs on failure
        if: failure()
        run: cat /tmp/nataiji-director-qa.log || true
