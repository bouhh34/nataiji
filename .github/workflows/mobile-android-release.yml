name: Android Play release bundle

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-release-v1
    paths:
      - '.github/workflows/mobile-android-release.yml'

permissions:
  contents: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android API 36
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Generate branded Android assets
        run: npm run mobile:assets:android

      - name: Sync web and native configuration
        run: npx cap sync android

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Validate signing secret set
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Sign release AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nataiji-release.keystore"
          jarsigner             -sigalg SHA256withRSA             -digestalg SHA-256             -keystore "$RUNNER_TEMP/nataiji-release.keystore"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             android/app/build/outputs/bundle/release/app-release.aab             "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: nataiji-android-play-SIGNED
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB dry run
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: nataiji-android-play-UNSIGNED
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
