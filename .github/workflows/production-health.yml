name: Production health

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/production-health.yml'
      - 'scripts/production-health.mjs'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify durable service and current public release after deployment
        run: node scripts/production-health.mjs
