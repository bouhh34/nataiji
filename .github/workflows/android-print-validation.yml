name: Android print compile
on:
  pull_request:
    paths: ['native/android/**', 'scripts/prepare-android-print.mjs', '.github/workflows/android-print-validation.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx cap add android
      - run: node scripts/prepare-android-print.mjs
      - run: node scripts/prepare-android-print.mjs
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
