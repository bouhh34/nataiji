name: Local recovery acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/app.js'
      - 'scripts/local-recovery-acceptance.mjs'
      - '.github/workflows/local-recovery-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nataiji_recovery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check public/app.js
      - name: Run local recovery acceptance
        env:
          DATABASE_URL: postgresql://postgres:local_test_password@127.0.0.1:5432/nataiji_recovery
        run: node scripts/local-recovery-acceptance.mjs
